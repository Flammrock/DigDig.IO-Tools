name: Release Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild (for example v2.0.0); leave empty to update the release PR'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Prepare release PR or create the merged release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    # A GITHUB_TOKEN-created tag does not trigger another workflow. Build here.
    # The status check also allows recovery when the release-please job is skipped.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: release-windows-assets-${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
      GH_REPO: ${{ github.repository }}
      NX_DAEMON: 'false'
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected a stable release tag such as v2.0.0.'
          }
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'The GitHub release must already exist.' }

      - name: Check out the exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the declared npm version
        run: |
          $manager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          npm install --global "$manager"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust for Windows x64
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable-x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check release versions
        run: node tools/check-versions.mjs "$env:RELEASE_TAG"

      - name: Typecheck
        run: npm run typecheck

      - name: Test JavaScript
        run: npm test

      - name: Test Rust
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the app and its embedded userscript
        run: npm run deploy

      - name: Verify and package release files
        run: ./tools/package-windows-release.ps1 -Tag "$env:RELEASE_TAG"

      - name: Retain the build if release upload needs retrying
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digdig-tools-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            deploy/DigDig-Map-Observatory.exe
            deploy/digdig.user.js
            deploy/README.txt
            deploy/manifest.json
            deploy/digdig-tools-${{ env.RELEASE_TAG }}-windows-x64.zip
            deploy/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:RELEASE_TAG" --repo "$env:GH_REPO" --clobber `
            deploy/DigDig-Map-Observatory.exe deploy/digdig.user.js `
            deploy/README.txt deploy/manifest.json deploy/SHA256SUMS.txt `
            "deploy/digdig-tools-$env:RELEASE_TAG-windows-x64.zip"
